appId: com.hydra.app
productName: Hydra
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!**/.env'
  - '!**/.env.*'
  - '!src/*'
  - '!shared/*'
  - '!electron/*'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,CHANGELOG.md}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json,electron.vite.config.ts}'
# The DSH bridge is executed by a plain Node process (Hydra tiles are ConPTYs
# and Electron's own runtime writes nothing to them), and stock Node cannot read
# inside app.asar. Keep a real file next to the archive.
asarUnpack:
  - out/main/dshBridge.js
publish:
  - provider: github
    owner: jpdlr
    repo: hydra
    releaseType: release
mac:
  icon: build/icon.png
  category: public.app-category.developer-tools
  hardenedRuntime: false
  gatekeeperAssess: false
  identity: null
  target:
    - dmg
    - dir
  artifactName: ${name}-${version}-${arch}.${ext}
win:
  icon: build/icon.ico
  target:
    - nsis
  artifactName: ${name}-${version}-${arch}.${ext}
linux:
  icon: build/icon.png
  category: Development
  maintainer: jpdlr <jpdlr@users.noreply.github.com>
  target:
    - AppImage
    - deb
  artifactName: ${name}-${version}-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
dmg:
  artifactName: ${name}-${version}.${ext}
