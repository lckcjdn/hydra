<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-label="Hydra nested harness session orchestration diagram"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#718096"/></marker></defs><rect width="1200" height="760" fill="#F6F8FB"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, Arial, sans-serif"><text x="600" y="39" font-size="30" font-weight="700" fill="#243247" text-anchor="middle">Hydra：可嵌套的 Harness Session 调度架构</text><text x="600" y="70" font-size="15" font-weight="400" fill="#64748B" text-anchor="middle">Hydra 管理 Session 与交接；Harness 保持自己的工具、MCP、Skills 和子 Agent</text><rect x="448" y="93" width="304" height="64" rx="14" fill="#E9F1FF" stroke="#6591C8" stroke-width="1.5"/><text x="600" y="122" font-size="18" font-weight="700" fill="#243247" text-anchor="middle">Hydra Desktop / Group UI</text><text x="600" y="147" font-size="13" font-weight="400" fill="#52637A" text-anchor="middle">树形分组 · 看板 · 人工接管</text><path d="M600 158 L600 189" stroke="#64748B" stroke-width="2.5"  fill="none" marker-end="url(#arrow)"/><rect x="371" y="192" width="458" height="70" rx="14" fill="#E4F5EC" stroke="#49A078" stroke-width="1.5"/><text x="600" y="221" font-size="18" font-weight="700" fill="#243247" text-anchor="middle">Hydra Core（确定性服务）</text><text x="600" y="246" font-size="13" font-weight="400" fill="#52637A" text-anchor="middle">状态机 · 事件 · 安全调度 · 持久化</text><path d="M600 264 V296 M600 296 H181 V317" stroke="#718096" stroke-width="2.5"  fill="none" marker-end="url(#arrow)"/><path d="M600 296 H460 V317" stroke="#718096" stroke-width="2.5"  fill="none" marker-end="url(#arrow)"/><path d="M600 296 H740 V317" stroke="#718096" stroke-width="2.5"  fill="none" marker-end="url(#arrow)"/><path d="M600 296 H1020 V317" stroke="#718096" stroke-width="2.5"  fill="none" marker-end="url(#arrow)"/><rect x="55" y="320" wid