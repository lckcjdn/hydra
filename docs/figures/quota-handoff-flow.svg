<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="695" viewBox="0 0 1200 695" role="img" aria-label="Hydra nested harness session orchestration diagram"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#718096"/></marker></defs><rect width="1200" height="695" fill="#F6F8FB"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, Arial, sans-serif"><text x="600" y="43" font-size="30" font-weight="700" fill="#243247" text-anchor="middle">额度耗尽 → 接力 → 恢复原 Session</text><text x="600" y="72" font-size="15" font-weight="400" fill="#64748B" text-anchor="middle">示意：Codex 与 DSH 共享任务成果，但不共享原生对话或 Harness 内部状态</text><rect x="40" y="107" width="264" height="48" rx="11" fill="#FFFFFF" stroke="#6591C8" stroke-width="1.5"/><text x="172" y="138" font-size="18" font-weight="700" fill="#243247" text-anchor="middle">Codex 原 Session</text><path d="M172 155 V630" stroke="#6591C8" stroke-width="1.8" stroke-dasharray="5 8" opacity=".56"/><rect x="325" y="107" width="264" height="48" rx="11" fill="#FFFFFF" stroke="#CE9E49" stroke-width="1.5"/><text x="457" y="138" font-size="18" font-weight="700" fill="#243247" text-anchor="middle">Quota Manager</text><path d="M457 155 V630" stroke="#CE9E49" stroke-width="1.8" stroke-dasharray="5 8" opacity=".56"/><rect x="610" y="107" width="264" height="48" rx="11" fill="#FFFFFF" stroke="#4DAB83" stroke-width="1.5"/><text x="742" y="138" font-size="18" font-weight="700" fill="#243247" text-anchor="middle">Hydra Manager</text><path d="M742 155 V630" stroke="#4DAB83" stroke-width="1.8" stroke-dasharray="5 8" opacity=".56"/><rect x="895" y="107" width="264" height="48" rx="11" fill="#FFFFFF" stroke="#9A83C2" stroke-width="1.5"/><text x="1027" y="138" font-size="18" font-weight="700" fill="#243247" text-anchor="middle">DSH 接力 Session</text><path d="M1027 155 V630" stroke="#9A83C2" stroke-width="1.8" stroke-dasharray="5 8" opacity=".56"/><rect x="25" y="181" width="1150" height="68" rx="12" fill="#F3F7FC" stroke="#D3DEE9" stroke-width="1.5"/><text x="50" y="205" font-size="17" font-weight="700" fill="#243247" text-anchor="start">① 正常开发</text><text x="50" y="229" font-size="12" font-weight="400" fill="#52637A" text-anchor="start">定期保存</text><path d="M305 214 H895" stroke="#718096" stroke-width="2.5"  fill="none" marker-end="url(#arrow)"/><text x="602" y="204" font-size="15" font-weight="700" fill="#243247" text-anchor="middle">最近的 Checkpoint 和 Git 状态入账</text><rect x="25" y="263" width="1150" height="70" rx="12" fill="#FFF5E5" stroke="#E0BE87" stroke-width="1.5"/><text x="50" y="287" font-size="17" font-weight="700" fill="#243247" text-anchor="start">② 额度限制</text><text x="50" y="309" font-size="12" font-weight="400" fill="#52637A" text-anchor="start">明确限额事件</text><path d="M305 293 H325" stroke="#718096" stroke-width="2.5"  fill="none" marker-end="url(#arrow)"/><path d="M590 293 H610" stroke="#718096" stroke-width="2.5"  fill="none" marker-end="url(#arrow)"/><text x="750" y="290" font-size="15" font-weight="700" fill="#243247" text-anchor="middle">block / retry-after / 置信度</text><text x="750" y="313" font-size="12" font-weight="400" fill="#52637A" text-anchor="middle">无证据时为 unknown，不推测重置时刻</text><rect x="25" y="346" width="1150" height="73" rx="12" fill="#EFF8F3" stroke="#A9D5BD" stroke-width="1.5"/><text x="50" y="372" font-size="17" font-weight="700" fill="#243247" text-anchor="start">③ 调度接力</text><text x="50" y="395" font-size="12" font-weight="400" fill="#52637A" text-anchor="start">原 Session 冻结</text><path d="M875 383 H895" stroke="#718096" stroke-width="2.5"  fill="none" marker-end="url(#arrow)"/><text x="755" y="369" font-size="14" font-weight="700" fill="#243247" text-anchor="middle">创建/复用 DSH</text><text x="755" y="394" font-size="12" font-weight="400" fill="#52637A" text-anchor="middle">发送目标 + 补丁 + 决策 + 待办</text><rect x="25" y="431" width="1150" height="72" rx="12" fill="#F7F3FD" stroke="#D0BDEB" stroke-width="1.5"/><text x="50" y="456" font-size="17" font-weight="700" fill="#243247" text-anchor="start">④ DSH 执行</text><text x="50" y="481" font-size="12" font-weight="400" fill="#52637A" text-anchor="start">可继续原生子 Agent</text><path d="M895 465 H610" stroke="#718096" stroke-width="2.5"  fill="none" marker-end="url(#arrow)"/><text x="755" y="449" font-size="14" font-weight="700" fill="#243247" text-anchor="middle">回传验收证据</text><text x="755" y="486" font-size="12" font-weight="400" fill="#52637A" text-anchor="middle">commit / diff / tests / task ledger</text><rect x="25" y="515" width="1150" height="105" rx="12" fill="#EDF3FF" stroke="#B9C9E9" stroke-width="1.5"/><text x="50" y="541" font-size="17" font-weight="700" fill="#243247" text-anchor="start">⑤ 恢复原 Session</text><text x="50" y="565" font-size="12" font-weight="400" fill="#52637A" text-anchor="start">先验真，再 Resume</text><path d="M590 554 H610" stroke="#718096" stroke-width="2.5"  fill="none" marker-end="url(#arrow)"/><path d="M610 581 H305" stroke="#718096" stroke-width="2.5"  fill="none" marker-end="url(#arrow)"/><text x="754" y="543" font-size="14" font-weight="700" fill="#243247" text-anchor="middle">Quota Manager 确认可用</text><text x="754" y="569" font-size="12" font-weight="400" fill="#52637A" text-anchor="middle">Manager 通知 Codex 读取新状态</text><text x="600" y="602" font-size="14" font-weight="700" fill="#243247" text-anchor="middle">Codex 审核 DSH 成果，继续剩余任务；正在完成的接力任务不强制抢回</text><text x="600" y="663" font-size="14" font-weight="400" fill="#52637A" text-anchor="middle">故障回退：额度无法可靠识别 → 手动确认；交接存在冲突 → 暂停合并并请求人工裁决。</text></g></svg>