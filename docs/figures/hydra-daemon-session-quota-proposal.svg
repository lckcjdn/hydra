<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="776" viewBox="0 0 1200 776" role="img" aria-label="Hydra design proposal"><rect width="1200" height="776" fill="#F5F7FB"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, Arial, sans-serif"><text x="35" y="44" font-size="29" fill="#203047" font-weight="700" text-anchor="start">Hydra · Daemon 重连 / Harness 调度 / 额度通道</text><text x="35" y="73" font-size="15" fill="#65778B" font-weight="400" text-anchor="start">客户端连接是可替换的；Session 控制和额度状态由不同的专用通道处理</text><rect x="34" y="98" width="1132" height="650" rx="17" fill="#FFFFFF" stroke="#D4E0EA" stroke-width="1.5"/><rect x="78" y="129" width="275" height="88" rx="11" fill="#E9F2FC" stroke="#789BC2" stroke-width="1.5"/><text x="215.5" y="161" font-size="17" fill="#243A53" font-weight="700" text-anchor="middle">Hydra Electron UI</text><text x="215.5" y="183" font-size="12" fill="#586A7F" font-weight="400" text-anchor="middle">Sidebar / Group Workspace</text><text x="215.5" y="200" font-size="12" fill="#586A7F" font-weight="400" text-anchor="middle">Agent Grid / Chat / Quota</text><rect x="463" y="129" width="300" height="88" rx="11" fill="#E4F3EC" stroke="#62A985" stroke-width="1.5"/><text x="613" y="161" font-size="17" fill="#243A53" font-weight="700" text-anchor="middle">Connection Manager</text><text x="613" y="183" font-size="12" fill="#586A7F" font-weight="400" text-anchor="middle">端口发现 · 重绑事件订阅</text><text x="613" y="200" font-size="12" fill="#586A7F" font-weight="400" text-anchor="middle">断线退避 / 健康检测</text><rect x="870" y="129" width="255" height="88" rx="11" fill="#EAF1FC" stroke="#789BC2" stroke-width="1.5"/><text x="997.5" y="161" font-size="17" fill="#243A53" font-weight="700" text-anchor="middle">Daemon Runtime</text><text x="997.5" y="183" font-size="12" fill="#586A7F" font-weight="400" text-anchor="middle">AgentManager · MCP · WS</text><text x="997.5" y="200" font-size="12" fill="#586A7F" font-weight="400" text-anchor="middle">OrchestrationService</text><path d="M353 173 L463 173" fill="none" stroke="#8192A9" stroke-width="2"/><text x="408" y="163" font-size="12" fill="#637A90" font-weight="700" text-anchor="middle">IPC</text><path d="M763 173 L870 173" fill="none" stroke="#8192A9" stroke-width="2"/><text x="818" y="163" font-size="12" fill="#637A90" font-weight="700" text-anchor="middle">rebind</text><rect x="463" y="255" width="300" height="78" rx="11" fill="#FFF4DC" stroke="#D5A75E" stroke-width="1.5"/><text x="613" y="287" font-size="17" fill="#243A53" font-weight="700" text-anchor="middle">Daemon 端口代际</text><text x="613" y="309" font-size="12" fill="#586A7F" font-weight="400" text-anchor="middle">lock: PID / port / startedAt</text><text x="613" y="326" font-size="12" fill="#586A7F" font-weight="400" text-anchor="middle">new client 代替旧 client</text><path d="M612 217 L612 255" fill="none" stroke="#8192A9" stroke-width="2"/><rect x="80" y="380" width="290" height="83" rx="11" fill="#F6F9FD" stroke="#AFC1D3" stroke-width="1.5"/><text x="225" y="412" font-size="17" fill="#243A53" font-weight="700" text-anchor="middle">Group / Task / Checkpoint</text><text x="225" y="434" font-size="12" fill="#586A7F" font-weight="400" text-anchor="middle">Task 分派与 Handoff</text><text x="225" y="451" font-size="12" fill="#586A7F" font-weight="400" text-anchor="middle">结构化进展 / 产物记录</text><rect x="459" y="380" width="305" height="83" rx="11" fill="#E5F4EC" stroke="#70B48F" stroke-width="1.5"/><text x="611.5" y="412" font-size="17" fill="#243A53" font-weight="700" text-anchor="middle">Session Runtime Adapter</text><text x="611.5" y="434" font-size="12" fill="#586A7F" font-weight="400" text-anchor="middle">创建 · 复用 · Resume</text><text x="611.5" y="451" font-size="12" fill="#586A7F" font-weight="400" text-anchor="middle">真正发送 Prompt，回收进程</text><rect x="856" y="380" width="286" height="83" rx="11" fill="#FFF1DF" stroke="#D3AC6B" stroke-width="1.5"/><text x="999" y="412" font-size="17" fill="#243A53" font-weight="700" text-anchor="middle">Quota Manager</text><text x="999" y="434" font-size="12" fill="#586A7F" font-weight="400" text-anchor="middle">账号额度池 / 上游 Route</text><text x="999" y="451" font-size="12" fill="#586A7F" font-weight="400" text-anchor="middle">blocked / unknown / resetAt</text><path d="M370 421 L459 421" fill="none" stroke="#8192A9" stroke-width="2"/><path d="M764 421 L856 421" fill="none" stroke="#8192A9" stroke-width="2"/><path d="M1005 217 L1005 333" fill="none" stroke="#8192A9" stroke-width="2"/><path d="M1005 333 L1005 380" fill="none" stroke="#8192A9" stroke-width="2"/><path d="M613 333 L613 380" fill="none" stroke="#8192A9" stroke-width="2"/><text x="600" y="355" font-size="13" fill="#738398" font-weight="500" text-anchor="middle">Daemon 核心依赖实际运行结果，而非仅修改状态字段</text><rect x="85" y="549" width="279" height="105" rx="11" fill="#E7F1FD" stroke="#6F9BCA" stroke-width="1.5"/><text x="224.5" y="581" font-size="17" fill="#243A53" font-weight="700" text-anchor="middle">Codex Session</text><text x="224.5" y="603" font-size="12" fill="#586A7F" font-weight="400" text-anchor="middle">原生 Resume ID + cwd</text><text x="224.5" y="620" font-size="12" fill="#586A7F" font-weight="400" text-anchor="middle">工具 / Skills / 子 Agent</text><text x="224.5" y="637" font-size="12" fill="#586A7F" font-weight="400" text-anchor="middle">Account: GPT Plan</text><rect x="460" y="549" width="279" height="105" rx="11" fill="#E8F5ED" stroke="#5AA987" stroke-width="1.5"/><text x="599.5" y="581" font-size="17" fill="#243A53" font-weight="700" text-anchor="middle">DSH ACP Session</text><text x="599.5" y="603" font-size="12" fill="#586A7F" font-weight="400" text-anchor="middle">DeepSeek Route 或 GLM Route</text><text x="599.5" y="620" font-size="12" fill="#586A7F" font-weight="400" text-anchor="middle">Hydra MCP（仅授权 Manager）</text><text x="599.5" y="637" font-size="12" fill="#586A7F" font-weight="400" text-anchor="middle">原生工具 / 子 Agent</text><rect x="850" y="549" width="279" height="105" rx="11" fill="#FDF2E3" stroke="#D5A964" stroke-width="1.5"/><text x="989.5" y="581" font-size="17" fill="#243A53" font-weight="700" text-anchor="middle">Provider Quota Pools</text><text x="989.5" y="603" font-size="12" fill="#586A7F" font-weight="400" text-anchor="middle">DeepSeek account  ≠  GLM account</text><text x="989.5" y="620" font-size="12" fill="#586A7F" font-weight="400" text-anchor="middle">observed quota + source</text><text x="989.5" y="637" font-size="12" fill="#586A7F" font-weight="400" text-anchor="middle">上下文 Token 仅作为用量</text><path d="M600 463 L600 549" fill="none" stroke="#8192A9" stroke-width="2"/><path d="M279 463 L279 549" fill="none" stroke="#8192A9" stroke-width="2"/><path d="M997 463 L997 549" fill="none" stroke="#8192A9" stroke-width="2"/><text x="600" y="705" font-size="14" fill="#4F647A" font-weight="600" text-anchor="middle">Runtime 接力：已有 Session 优先 → 原生恢复 → 执行结果验收 → Checkpoint 同步回原 Session</text></g></svg>